<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日热点美文 · 一键复制发布</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1f2329;--sub:#6b7280;--line:#e8eaed;--brand:#c0392b;--brand2:#e74c3c;--tag:#fdf2f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;padding:18px 0 26px}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:1px}
  header p{margin:0;color:var(--sub);font-size:13px}
  .day{display:inline-block;margin-top:12px;background:var(--tag);color:var(--brand);border-radius:20px;padding:3px 14px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:8px}
  .no{background:var(--brand);color:#fff;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .plat{background:#f1f3f5;border-radius:4px;padding:1px 7px}
  .card h2{font-size:18px;margin:6px 0 10px;line-height:1.5}
  .body{white-space:pre-wrap;color:#374151}
  .body.fold{max-height:96px;overflow:hidden;position:relative}
  .body.fold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,#fff)}
  .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{border:0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600}
  .copy{background:var(--brand);color:#fff}
  .copy:hover{background:var(--brand2)}
  .more{background:#f1f3f5;color:#374151}
  a.src{color:var(--sub);font-size:12px;text-decoration:none;margin-left:auto;align-self:center}
  a.src:hover{color:var(--brand)}
  footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:30px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1f2329;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--sub);padding:50px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每日热点美文</h1>
    <p>全网热点 · 每日自动更新 · 一键复制即可发布</p>
    <span class="day" id="day">加载中…</span>
  </header>
  <main id="list"><div class="empty">正在加载今日内容…</div></main>
  <footer>
    内容由 AI 辅助生成，请人工核对事实后再发布<br>
    素材来源为公开热榜 · 仅供个人学习参考
  </footer>
</div>
<div class="toast" id="toast">已复制，去粘贴发布吧</div>

<script>
const $ = s => document.querySelector(s);
let POSTS = [];

function render(data){
  POSTS = data.posts || [];
  $('#day').textContent = '更新于 ' + (data.updated_at || data.generated_at || '');
  if(!POSTS.length){ $('#list').innerHTML = '<div class="empty">今日暂无内容</div>'; return; }
  $('#list').innerHTML = POSTS.map((p,i)=>`
    <article class="card">
      <div class="meta">
        <span class="no">${i+1}</span>
        <span class="plat">${p.platform||'热点'}</span>
        <span>${(p.body||'').length} 字</span>
      </div>
      <h2>${esc(p.title)}</h2>
      <div class="body fold" id="b${i}">${esc(p.body)}</div>
      <div class="acts">
        <button class="copy" onclick="doCopy(${i})">一键复制全文</button>
        <button class="more" onclick="toggle(${i},this)">展开全文</button>
        ${p.url?`<a class="src" href="${esc(p.url)}" target="_blank" rel="noopener">查看原始热点 ↗</a>`:''}
      </div>
    </article>`).join('');
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toggle(i,btn){
  const el=document.getElementById('b'+i);
  el.classList.toggle('fold');
  btn.textContent = el.classList.contains('fold')?'展开全文':'收起';
}
async function doCopy(i){
  const p=POSTS[i];
  const text = p.title + '\n\n' + p.body + '\n\n（素材来源：' + (p.platform||'公开热榜') + '）';
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();
  }
  const t=$('#toast'); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
fetch('posts.json?t='+Date.now()).then(r=>r.json()).then(render)
  .catch(()=>{ $('#list').innerHTML='<div class="empty">加载失败，请确认 posts.json 已生成</div>'; });
</script>
</body>
</html>
